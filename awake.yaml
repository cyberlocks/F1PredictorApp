name: Keep Streamlit Awake
on:
  schedule:
    - cron: '0 */4 * * *'  # Runs every 4 hours (UTC)
  workflow_dispatch:       # Lets you run manually anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app to keep awake
        run: |
          curl -s -I https://richardcarroll2.streamlit.app > /dev/null
          echo "✅ Pinged your app successfully"
